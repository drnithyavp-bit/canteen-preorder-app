
<!DOCTYPE html>
<html>
<head>
    <title>College Canteen Pre-order</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>College Canteen</h1>
        <p>Order your food before you reach the canteen!</p>
    </header>

    <main>
        <h2>Available Food Items</h2>

        <div class="food-item">
            <h3>Veg Sandwich</h3>
            <p>Price: ₹40</p>
            <button onclick="orderFood('Veg Sandwich')">
                Order Now
            </button>
        </div>

        <div class="food-item">
            <h3>Masala Dosa</h3>
            <p>Price: ₹50</p>
            <button onclick="orderFood('Masala Dosa')">
                Order Now
            </button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
